name: macos

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: 'true'
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
        
    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Configure GameMath
      run: |
        cmake --preset macos
        
    - name: Build GameMath
      run: |
        cmake --build build
